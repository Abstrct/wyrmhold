<!doctype html>
<!-- One link card, 1200×630. render.mjs opens it with the page's words in the query:
     ?scene=scenes/hold.jpg&eyebrow=…&title=…&tag=line one|line two&foot=…&x=0&y=0&w=1200 -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@1&family=IBM+Plex+Mono:wght@500&family=Alegreya+Sans:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0e1a}
.bg{position:absolute;inset:0;background-repeat:no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent var(--fade,0px),#000 calc(var(--fade,0px) + 220px));mask-image:linear-gradient(90deg,transparent var(--fade,0px),#000 calc(var(--fade,0px) + 220px))}
.scrim{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(11,9,30,.9) 0%,rgba(14,11,38,.66) 36%,rgba(14,11,38,0) 60%),
  linear-gradient(0deg,rgba(11,9,30,.72) 0%,rgba(11,9,30,0) 30%)}
.frame{position:absolute;inset:18px;border:1px solid rgba(232,200,114,.42);border-radius:6px}
.frame:before{content:"";position:absolute;inset:6px;border:1px solid rgba(232,200,114,.16);border-radius:3px}
.txt{position:absolute;left:80px;top:0;bottom:120px;width:620px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:500 15px/1.3 'IBM Plex Mono',monospace;letter-spacing:.28em;color:#7fe0d0;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.eyebrow:before{content:"";flex:0 0 46px;height:1px;background:linear-gradient(90deg,transparent,#7fe0d0)}
h1{margin:18px 0 0;font:400 124px/0.98 'IM Fell English SC',serif;letter-spacing:.01em;white-space:nowrap;
  background:linear-gradient(180deg,#fff6d8 0%,#f0d58a 55%,#b88a3a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(232,200,114,.25))}
.tag{margin:22px 0 0;font:italic 40px/1.15 'IM Fell English',serif;color:#f3ead8;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.foot{position:absolute;left:84px;bottom:66px;display:flex;align-items:center;gap:16px;font:500 21px/1 'Alegreya Sans',sans-serif;color:#e9e1f5;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.foot b{color:#e8c872;font-weight:500}
.dot{color:#e8c872}
.sig{position:absolute;right:52px;bottom:48px;filter:drop-shadow(0 0 12px rgba(232,200,114,.7))}
</style></head><body>
<div class="bg" id="bg"></div><div class="scrim"></div><div class="frame"></div>
<div class="txt"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="tag" id="tag"></p></div>
<div class="foot" id="foot"></div>
<svg class="sig" width="54" height="54" viewBox="0 0 40 40" fill="none" stroke="#e8c872" stroke-width="1.3"><path d="M20 2 L37 20 L20 38 L3 20 Z" fill="rgba(11,14,26,.55)"/><path d="M8 20 C13 12, 27 12, 32 20 C27 28, 13 28, 8 20 Z"/><path d="M20 13 C22 17, 22 23, 20 27 C18 23, 18 17, 20 13 Z" fill="#e8c872"/></svg>
<script>
  const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
  const w = Number(q.get('w') || 1200), x = Number(q.get('x') || 0), y = Number(q.get('y') || 0);
  Object.assign($('bg').style, { backgroundImage: `url(${q.get('scene')})`, backgroundSize: `${w}px ${Math.round(w * 630 / 1200)}px`, backgroundPosition: `${x}px ${y}px` });
  if (x > 0) $('bg').style.setProperty('--fade', x + 'px');
  $('eyebrow').textContent = q.get('eyebrow') || '';
  $('title').textContent = q.get('title') || '';
  (q.get('tag') || '').split('|').forEach((line, i) => { if (i) $('tag').append(document.createElement('br')); $('tag').append(line); });
  (q.get('foot') || '').split('|').forEach((bit, i) => {
    if (i) { const d = document.createElement('span'); d.className = 'dot'; d.textContent = '✦'; $('foot').append(d); }
    const el = document.createElement(i ? 'span' : 'b'); el.textContent = bit; $('foot').append(el);
  });
  // a long name shrinks until it fits beside the scene
  document.fonts.ready.then(() => { const h = $('title'); let s = 124; while (h.scrollWidth > 570 && s > 64) h.style.fontSize = (s -= 4) + 'px'; document.body.dataset.ready = '1'; });
</script>
</body></html>
