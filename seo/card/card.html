<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@1&family=IBM+Plex+Mono:wght@500&family=Alegreya+Sans:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0e1a}
.bg{position:absolute;inset:0;background:url(gate-raw.jpg) 0px -30px/1380px 725px no-repeat}
.scrim{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(11,9,30,.88) 0%,rgba(14,11,38,.62) 34%,rgba(14,11,38,0) 58%),
  linear-gradient(0deg,rgba(11,9,30,.7) 0%,rgba(11,9,30,0) 30%)}
.frame{position:absolute;inset:18px;border:1px solid rgba(232,200,114,.42);border-radius:6px}
.frame:before{content:"";position:absolute;inset:6px;border:1px solid rgba(232,200,114,.16);border-radius:3px}
.txt{position:absolute;left:80px;top:132px;width:600px}
.eyebrow{font:500 15px/1 'IBM Plex Mono',monospace;letter-spacing:.28em;color:#7fe0d0;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.eyebrow:before{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,#7fe0d0)}
h1{margin:18px 0 0;font:400 124px/0.95 'IM Fell English SC',serif;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff6d8 0%,#f0d58a 55%,#b88a3a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(232,200,114,.25))}
.tag{margin:22px 0 0;font:italic 40px/1.15 'IM Fell English',serif;color:#f3ead8;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.foot{position:absolute;left:84px;bottom:66px;display:flex;align-items:center;gap:16px;font:500 21px/1 'Alegreya Sans',sans-serif;color:#e9e1f5;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.foot b{color:#e8c872;font-weight:500}
.dot{color:#e8c872}
.sig{position:absolute;right:52px;bottom:48px;filter:drop-shadow(0 0 12px rgba(232,200,114,.7))}
</style></head><body>
<div class="bg"></div><div class="scrim"></div><div class="frame"></div>
<div class="txt">
  <div class="eyebrow">When the sky broke, alpha fell like rain</div>
  <h1>Wyrmhodl</h1>
  <p class="tag">Bind beasts. Brew alpha.<br>Hold the broken sky.</p>
</div>
<div class="foot"><b>Free to play</b><span class="dot">✦</span>in your browser<span class="dot">✦</span>every warden a real player</div>

</body></html>
