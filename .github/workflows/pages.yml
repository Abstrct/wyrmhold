# Builds the game and publishes dist/ to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Optional repo variables (Settings → Secrets and variables → Actions → Variables) are baked into
# the build: VITE_LCD_URL, VITE_RPC_WS_URL, VITE_DEFAULT_GUILD, VITE_GRASS_URL, VITE_RELAY_URL, VITE_GUILD_READS.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_LCD_URL: ${{ vars.VITE_LCD_URL }}
          VITE_RPC_WS_URL: ${{ vars.VITE_RPC_WS_URL }}
          VITE_DEFAULT_GUILD: ${{ vars.VITE_DEFAULT_GUILD }}
          VITE_GRASS_URL: ${{ vars.VITE_GRASS_URL }}
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          VITE_GUILD_READS: ${{ vars.VITE_GUILD_READS }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
